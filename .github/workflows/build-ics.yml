name: Build menu.ics

# Regenerates menu.ics whenever the menu is edited, so calendar
# subscribers always see the current month. Editing menu.json from the
# phone (via GitHub's web editor) triggers this automatically.

on:
  push:
    branches: [main]
    paths:
      - menu.json
      - generate_ics.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate menu.ics
        run: python3 generate_ics.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain menu.ics)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add menu.ics
            git commit -m "chore: regenerate menu.ics"
            git push
          else
            echo "menu.ics is already up to date."
          fi
